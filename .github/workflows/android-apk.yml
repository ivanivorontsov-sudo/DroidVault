name: Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon :android-app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidVault-debug-apk
          path: android-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
