[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "droidvault"
version = "0.1.0"
description = "ADB-based Android APK backup and restore utility"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
droidvault = "droidvault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
